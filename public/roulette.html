<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>점심 메뉴 룰렛</title>
  <meta name="description" content="오늘 점심 뭐 먹지? 룰렛을 돌려서 정해보세요." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍱</text></svg>" />
  <style>
    :root {
      --bg: #fff8f0;
      --text: #2b2118;
      --muted: #8a7a6b;
      --card: #ffffff;
      --line: #eadccf;
      --accent: #ff5a36;
      --accent-dark: #e0441f;
      --ring: #2b2118;
      --shadow: 0 12px 40px rgba(80, 40, 10, 0.18);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1a1512;
        --text: #f5ece3;
        --muted: #b3a393;
        --card: #2a221d;
        --line: #42372f;
        --ring: #f5ece3;
        --shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
      }
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", "Malgun Gothic", sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100dvh;
      padding: 24px 16px calc(32px + env(safe-area-inset-bottom));
      gap: 24px;
      -webkit-tap-highlight-color: transparent;
      overflow-x: hidden;
    }

    header { text-align: center; }
    h1 { font-size: clamp(1.6rem, 6vw, 2.2rem); font-weight: 800; letter-spacing: -0.02em; }
    header p { color: var(--muted); margin-top: 6px; font-size: 0.95rem; }

    .wheel-wrap {
      position: relative;
      width: min(88vw, 440px, 60dvh);
      aspect-ratio: 1;
      flex-shrink: 0;
    }

    .pointer {
      position: absolute;
      top: -6px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 16px solid transparent;
      border-right: 16px solid transparent;
      border-top: 30px solid var(--accent);
      filter: drop-shadow(0 3px 3px rgba(0, 0, 0, 0.3));
      z-index: 2;
    }

    #wheel {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      box-shadow: var(--shadow);
      transform: rotate(0deg);
      transition: transform 3s cubic-bezier(0.17, 0.67, 0.12, 1);
      display: block;
    }

    #wheel text {
      font-weight: 700;
      fill: #2b2118;
      pointer-events: none;
    }

    .hub {
      position: absolute;
      inset: 50% auto auto 50%;
      width: 16%;
      aspect-ratio: 1;
      transform: translate(-50%, -50%);
      background: var(--card);
      border: 4px solid var(--ring);
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-size: clamp(1.2rem, 5vw, 1.8rem);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
    }

    #spin {
      appearance: none;
      border: none;
      background: var(--accent);
      color: #fff;
      font-size: 1.25rem;
      font-weight: 800;
      padding: 16px 56px;
      border-radius: 999px;
      cursor: pointer;
      box-shadow: 0 6px 0 var(--accent-dark), 0 10px 24px rgba(255, 90, 54, 0.35);
      transition: transform 0.1s, box-shadow 0.1s, opacity 0.2s;
      min-width: 200px;
    }
    #spin:active:not(:disabled) {
      transform: translateY(4px);
      box-shadow: 0 2px 0 var(--accent-dark), 0 4px 12px rgba(255, 90, 54, 0.35);
    }
    #spin:disabled { opacity: 0.55; cursor: default; }
    button:focus-visible, input:focus-visible { outline: 3px solid var(--ring); outline-offset: 3px; }

    /* 메뉴 후보 편집 */
    .editor {
      width: min(100%, 440px);
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 18px 16px;
    }
    .editor-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    .editor-head h2 { font-size: 1.05rem; font-weight: 800; }
    .editor-head span { color: var(--muted); font-size: 0.85rem; }

    .add-form { display: flex; gap: 8px; }
    .add-form input {
      flex: 1;
      min-width: 0;
      font: inherit;
      font-size: 1rem; /* iOS 확대 방지 */
      padding: 10px 14px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--bg);
      color: var(--text);
    }
    .add-form button, .reset {
      appearance: none;
      font: inherit;
      font-weight: 700;
      border-radius: 12px;
      cursor: pointer;
    }
    .add-form button {
      border: none;
      background: var(--text);
      color: var(--bg);
      padding: 10px 18px;
    }
    .hint { min-height: 1.2em; margin-top: 6px; font-size: 0.85rem; color: var(--accent); }

    .chips { list-style: none; display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
    .chips li {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 6px 6px 6px 12px;
      border-radius: 999px;
      font-size: 0.95rem;
      font-weight: 600;
      color: #2b2118;
    }
    .chips button {
      appearance: none;
      border: none;
      background: rgba(0, 0, 0, 0.08);
      color: inherit;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 0.8rem;
      line-height: 1;
    }
    .chips button:disabled { opacity: 0.3; cursor: default; }

    .reset {
      margin-top: 14px;
      border: 1px solid var(--line);
      background: transparent;
      color: var(--muted);
      padding: 8px 14px;
      font-size: 0.85rem;
    }

    .editor.locked { opacity: 0.6; pointer-events: none; }

    /* 결과 오버레이 */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(20, 12, 6, 0.6);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      display: grid;
      place-items: center;
      padding: 16px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s;
      z-index: 10;
    }
    .overlay.show { opacity: 1; pointer-events: auto; }

    .result {
      background: var(--card);
      border-radius: 28px;
      padding: 36px 24px 24px;
      width: min(100%, 380px);
      text-align: center;
      box-shadow: var(--shadow);
      transform: scale(0.7);
      transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .overlay.show .result { transform: scale(1); }

    .result .label { color: var(--muted); font-weight: 600; font-size: 1rem; }
    .result .emoji { font-size: clamp(4rem, 22vw, 6rem); line-height: 1.2; margin-top: 12px; }
    .result .name {
      font-size: clamp(2.4rem, 12vw, 3.4rem);
      font-weight: 900;
      letter-spacing: -0.03em;
      color: var(--accent);
      margin: 4px 0 24px;
      word-break: keep-all;
      overflow-wrap: anywhere;
    }
    .result-actions { display: flex; flex-direction: column; gap: 10px; }
    .result-actions button {
      appearance: none;
      font: inherit;
      font-size: 1rem;
      font-weight: 700;
      padding: 13px 24px;
      border-radius: 999px;
      cursor: pointer;
    }
    #copy { border: none; background: var(--accent); color: #fff; }
    #again { border: 2px solid var(--ring); background: transparent; color: var(--text); }
    .copied { min-height: 1.2em; margin-top: 10px; font-size: 0.9rem; color: var(--muted); }
  </style>
</head>
<body>
  <header>
    <h1>🍽️ 오늘 점심 뭐 먹지?</h1>
    <p>고민은 룰렛에게 맡기세요</p>
  </header>

  <div class="wheel-wrap">
    <div class="pointer" aria-hidden="true"></div>
    <svg id="wheel" viewBox="-100 -100 200 200" role="img" aria-label="점심 메뉴 룰렛"></svg>
    <div class="hub" aria-hidden="true">🍴</div>
  </div>

  <button id="spin" type="button">돌리기</button>

  <section class="editor" id="editor" aria-labelledby="editor-title">
    <div class="editor-head">
      <h2 id="editor-title">메뉴 후보</h2>
      <span id="count"></span>
    </div>
    <form class="add-form" id="add-form">
      <input id="menu-input" type="text" maxlength="10" placeholder="메뉴 이름 (예: 마라탕)" autocomplete="off" aria-label="추가할 메뉴 이름" />
      <button type="submit">추가</button>
    </form>
    <p class="hint" id="hint" role="status"></p>
    <ul class="chips" id="chips"></ul>
    <button type="button" class="reset" id="reset">기본 메뉴 10개로 되돌리기</button>
  </section>

  <div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-labelledby="result-name">
    <div class="result">
      <div class="label">오늘의 점심은</div>
      <div class="emoji" id="result-emoji"></div>
      <div class="name" id="result-name"></div>
      <div class="result-actions">
        <button type="button" id="copy">결과 복사</button>
        <button type="button" id="again">다시 돌리기</button>
      </div>
      <p class="copied" id="copied" role="status"></p>
    </div>
  </div>

  <script>
    const DEFAULT_MENUS = [
      { name: "김치찌개", emoji: "🍲" },
      { name: "된장찌개", emoji: "🥘" },
      { name: "비빔밥",   emoji: "🍚" },
      { name: "제육볶음", emoji: "🥓" },
      { name: "돈가스",   emoji: "🍖" },
      { name: "짜장면",   emoji: "🍜" },
      { name: "짬뽕",     emoji: "🌶️" },
      { name: "초밥",     emoji: "🍣" },
      { name: "쌀국수",   emoji: "🍜" },
      { name: "햄버거",   emoji: "🍔" },
    ];
    const COLORS = [
      "#ffb4a2", "#ffd6a5", "#fdffb6", "#caffbf", "#9bf6ff",
      "#a0c4ff", "#bdb2ff", "#ffc6ff", "#ffadad", "#d0f4de",
      "#fbe0c3", "#c8e7ff",
    ];
    const MIN_MENUS = 2;
    const MAX_MENUS = 12;
    const SPIN_MS = 3000;
    const R = 98;
    const STORAGE_KEY = "lunch-roulette-menus";
    const NS = "http://www.w3.org/2000/svg";

    const wheel = document.getElementById("wheel");
    const spinBtn = document.getElementById("spin");
    const editor = document.getElementById("editor");
    const addForm = document.getElementById("add-form");
    const menuInput = document.getElementById("menu-input");
    const hint = document.getElementById("hint");
    const chips = document.getElementById("chips");
    const count = document.getElementById("count");
    const overlay = document.getElementById("overlay");
    const copyBtn = document.getElementById("copy");
    const againBtn = document.getElementById("again");
    const copied = document.getElementById("copied");

    // 브라우저 저장소는 막혀 있을 수 있으므로 실패하면 기본 메뉴로 동작
    function loadMenus() {
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
        if (Array.isArray(saved) && saved.length >= MIN_MENUS) return saved;
      } catch (e) {}
      return DEFAULT_MENUS.map((m) => ({ ...m }));
    }
    function saveMenus() {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(menus)); } catch (e) {}
    }

    let menus = loadMenus();
    let rotation = 0;
    let spinning = false;
    let current = null;

    // 각도는 12시 방향에서 시계 방향으로 측정
    const point = (deg, r) => {
      const rad = (deg * Math.PI) / 180;
      return [r * Math.sin(rad), -r * Math.cos(rad)];
    };

    function renderWheel() {
      wheel.replaceChildren();
      const seg = 360 / menus.length;
      // 칸이 많아질수록 글자를 조금씩 줄임
      const fontSize = menus.length <= 8 ? 11.5 : menus.length <= 10 ? 10.5 : 9.5;

      menus.forEach((menu, i) => {
        const a0 = i * seg;
        const [x0, y0] = point(a0, R);
        const [x1, y1] = point(a0 + seg, R);

        const path = document.createElementNS(NS, "path");
        path.setAttribute("d", `M0 0 L${x0} ${y0} A${R} ${R} 0 0 1 ${x1} ${y1} Z`);
        path.setAttribute("fill", COLORS[i % COLORS.length]);
        path.setAttribute("stroke", "#fff");
        path.setAttribute("stroke-width", "1.2");
        wheel.appendChild(path);

        // 글자는 바깥쪽에서 중심 방향으로 배치
        const g = document.createElementNS(NS, "g");
        g.setAttribute("transform", `rotate(${a0 + seg / 2 - 90})`);
        const text = document.createElementNS(NS, "text");
        text.setAttribute("x", "88");
        text.setAttribute("text-anchor", "end");
        text.setAttribute("dominant-baseline", "central");
        text.setAttribute("font-size", fontSize);
        const label = menu.name.length > 6 ? menu.name.slice(0, 5) + "…" : menu.name;
        text.textContent = `${label} ${menu.emoji}`;
        g.appendChild(text);
        wheel.appendChild(g);
      });

      const rim = document.createElementNS(NS, "circle");
      rim.setAttribute("r", R);
      rim.setAttribute("fill", "none");
      rim.setAttribute("stroke", "#2b2118");
      rim.setAttribute("stroke-width", "3");
      wheel.appendChild(rim);
    }

    function renderChips() {
      chips.replaceChildren();
      menus.forEach((menu, i) => {
        const li = document.createElement("li");
        li.style.background = COLORS[i % COLORS.length];
        li.append(`${menu.emoji} ${menu.name}`);
        const del = document.createElement("button");
        del.type = "button";
        del.textContent = "✕";
        del.setAttribute("aria-label", `${menu.name} 삭제`);
        del.disabled = menus.length <= MIN_MENUS;
        del.addEventListener("click", () => removeMenu(i));
        li.appendChild(del);
        chips.appendChild(li);
      });
      count.textContent = `${menus.length}개 (최대 ${MAX_MENUS}개)`;
    }

    function render() {
      renderWheel();
      renderChips();
      saveMenus();
    }

    function addMenu(name) {
      name = name.trim();
      if (!name) return (hint.textContent = "메뉴 이름을 입력해 주세요.");
      if (menus.length >= MAX_MENUS) return (hint.textContent = `메뉴는 최대 ${MAX_MENUS}개까지 넣을 수 있어요.`);
      if (menus.some((m) => m.name === name)) return (hint.textContent = "이미 있는 메뉴예요.");
      menus.push({ name, emoji: "🍽️" });
      hint.textContent = "";
      menuInput.value = "";
      render();
    }

    function removeMenu(i) {
      if (menus.length <= MIN_MENUS) return;
      menus.splice(i, 1);
      hint.textContent = "";
      render();
    }

    function spin() {
      if (spinning) return;
      spinning = true;
      spinBtn.disabled = true;
      editor.classList.add("locked");

      const seg = 360 / menus.length;
      const index = Math.floor(Math.random() * menus.length);
      // 칸 경계에 걸리지 않도록 칸 안쪽 80% 범위에서 랜덤 위치
      const offset = (Math.random() - 0.5) * seg * 0.8;
      const targetAngle = index * seg + seg / 2 + offset;
      const finalMod = (360 - targetAngle) % 360;
      const currentMod = ((rotation % 360) + 360) % 360;
      const extraTurns = 360 * (5 + Math.floor(Math.random() * 3));

      rotation += extraTurns + ((finalMod - currentMod + 360) % 360);
      wheel.style.transform = `rotate(${rotation}deg)`;

      setTimeout(() => showResult(menus[index]), SPIN_MS + 150);
    }

    function showResult(menu) {
      current = menu;
      document.getElementById("result-emoji").textContent = menu.emoji;
      document.getElementById("result-name").textContent = menu.name;
      copied.textContent = "";
      overlay.classList.add("show");
      copyBtn.focus();
    }

    function closeResult() {
      overlay.classList.remove("show");
      spinning = false;
      spinBtn.disabled = false;
      editor.classList.remove("locked");
      spinBtn.focus();
    }

    // 메신저에 붙여넣기 좋은 문구로 복사
    async function copyResult() {
      const text = `🍱 오늘 점심은 ${current.emoji} ${current.name}!\n(점심 메뉴 룰렛으로 정했어요)`;
      try {
        await navigator.clipboard.writeText(text);
      } catch (e) {
        // clipboard API를 못 쓰는 환경(일부 인앱 브라우저 등)용 대체 방법
        const ta = document.createElement("textarea");
        ta.value = text;
        ta.style.position = "fixed";
        ta.style.opacity = "0";
        document.body.appendChild(ta);
        ta.select();
        const ok = document.execCommand("copy");
        ta.remove();
        if (!ok) return (copied.textContent = "복사하지 못했어요. 직접 입력해 주세요.");
      }
      copied.textContent = "복사됐어요! 메신저에 붙여넣으세요.";
    }

    spinBtn.addEventListener("click", spin);
    addForm.addEventListener("submit", (e) => { e.preventDefault(); addMenu(menuInput.value); });
    document.getElementById("reset").addEventListener("click", () => {
      menus = DEFAULT_MENUS.map((m) => ({ ...m }));
      hint.textContent = "";
      render();
    });
    copyBtn.addEventListener("click", copyResult);
    againBtn.addEventListener("click", () => { closeResult(); setTimeout(spin, 250); });
    overlay.addEventListener("click", (e) => { if (e.target === overlay) closeResult(); });
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape" && overlay.classList.contains("show")) closeResult();
    });

    render();
  </script>
</body>
</html>
